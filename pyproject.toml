[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sibyla"
version = "0.1.0"
description = "Sibyla Translate — leitor e tradutor de PDFs e EPUBs"
requires-python = ">=3.11"
dependencies = [
    # UI
    "PySide6>=6.6",
    # PDF render e extração
    "PyMuPDF>=1.24",
    "pdfplumber>=0.11",
    # EPUB
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # Tradução
    "deep-translator>=1.11",
    # Exportação
    "python-docx>=1.1",
    "reportlab>=4.0",
    "Pillow>=10.0",
    # Pydantic (modelos)
    "pydantic>=2.0",
    # Detecção de idioma (opcional)
    "langdetect>=1.0",
]

[project.scripts]
sibyla = "sibyla.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sibyla*"]
